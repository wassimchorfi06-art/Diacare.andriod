name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Copy www to assets
        run: cp -r www android-project/app/src/main/assets/

      - name: Make gradlew executable
        run: chmod +x android-project/gradlew

      - name: Build APK
        run: |
          cd android-project
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiaCare-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
