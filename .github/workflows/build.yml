name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show structure
        run: find . -maxdepth 3 -type f | grep -v ".git"

      - name: Copy www to assets
        run: |
          mkdir -p android-project/app/src/main/assets/www
          if [ -d "www" ]; then
            cp -r www/. android-project/app/src/main/assets/www/
          elif [ -d "diacare-android/www" ]; then
            cp -r diacare-android/www/. android-project/app/src/main/assets/www/
          else
            echo "www not found, checking structure..."
            find . -name "index.html"
          fi

      - name: Make gradlew executable
        run: |
          if [ -f "android-project/gradlew" ]; then
            chmod +x android-project/gradlew
          elif [ -f "diacare-android/android-project/gradlew" ]; then
            chmod +x diacare-android/android-project/gradlew
          fi

      - name: Build APK
        run: |
          if [ -d "android-project" ]; then
            cd android-project && ./gradlew assembleDebug
          else
            cd diacare-android/android-project && ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiaCare-APK
          path: |
            android-project/app/build/outputs/apk/debug/app-debug.apk
            diacare-android/android-project/app/build/outputs/apk/debug/app-debug.apk
